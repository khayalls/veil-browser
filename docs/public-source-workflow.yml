name: Public source audit

on: [push, pull_request]

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publication guard and regression tests
        run: |
          python3 scripts/audit_public.py --tree
          python3 scripts/audit_public.py --staged
          python3 scripts/audit_public.py --history
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s Tests -p 'test_public_audit.py'
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/veil-gitleaks"
          cd "$RUNNER_TEMP/veil-gitleaks"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o scanner.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  scanner.tar.gz' | sha256sum --check
          tar -xzf scanner.tar.gz gitleaks
      - name: Scan complete history and exported source
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/veil-gitleaks/gitleaks" git . --redact
          mkdir -p "$RUNNER_TEMP/veil-export"
          git archive HEAD -o "$RUNNER_TEMP/veil-source.tar"
          python3 scripts/audit_public.py --archive "$RUNNER_TEMP/veil-source.tar"
          tar -xf "$RUNNER_TEMP/veil-source.tar" -C "$RUNNER_TEMP/veil-export"
          "$RUNNER_TEMP/veil-gitleaks/gitleaks" dir "$RUNNER_TEMP/veil-export" --redact
